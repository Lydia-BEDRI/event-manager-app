services:
  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - eventmanager-prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      cadvisor:
        condition: service_started
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/bin/promtool", "query", "instant", "http://127.0.0.1:9090", "up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - eventmanager-grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - internal

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - eventmanager-uptime-kuma-data:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  matomo-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MATOMO_DATABASE:?MATOMO_DATABASE is required}
      MARIADB_USER: ${MATOMO_DATABASE_USER:?MATOMO_DATABASE_USER is required}
      MARIADB_PASSWORD: ${MATOMO_DATABASE_PASSWORD:?MATOMO_DATABASE_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${MATOMO_DATABASE_ROOT_PASSWORD:?MATOMO_DATABASE_ROOT_PASSWORD is required}
    volumes:
      - eventmanager-matomo-db-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  matomo:
    image: matomo:5-apache
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_DBNAME: ${MATOMO_DATABASE:?MATOMO_DATABASE is required}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DATABASE_USER:?MATOMO_DATABASE_USER is required}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DATABASE_PASSWORD:?MATOMO_DATABASE_PASSWORD is required}
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - eventmanager-matomo-data:/var/www/html
    depends_on:
      matomo-db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 80); exit($$socket ? 0 : 1);'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  eventmanager-prometheus-data:
  eventmanager-grafana-data:
  eventmanager-uptime-kuma-data:
  eventmanager-matomo-db-data:
  eventmanager-matomo-data:
