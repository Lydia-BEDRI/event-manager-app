name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
      CI_MYSQL_DATABASE: eventmanager
      CI_MYSQL_USER: eventmanager_user
      CI_MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: eventmanager_user
      DB_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
      DB_NAME: eventmanager
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize and validate required CI secrets
        run: |
          MYSQL_ROOT_PASSWORD_CLEAN="$(printf '%s' "$CI_MYSQL_ROOT_PASSWORD" | tr -d '\r\n')"
          MYSQL_PASSWORD_CLEAN="$(printf '%s' "$CI_MYSQL_PASSWORD" | tr -d '\r\n')"
          JWT_SECRET_CLEAN="$(printf '%s' "$JWT_SECRET" | tr -d '\r\n')"

          test -n "$MYSQL_ROOT_PASSWORD_CLEAN" || (echo "Missing secret CI_MYSQL_ROOT_PASSWORD" && exit 1)
          test -n "$MYSQL_PASSWORD_CLEAN" || (echo "Missing secret CI_MYSQL_PASSWORD" && exit 1)
          test -n "$JWT_SECRET_CLEAN" || (echo "Missing secret CI_JWT_SECRET" && exit 1)

          echo "::add-mask::$MYSQL_ROOT_PASSWORD_CLEAN"
          echo "::add-mask::$MYSQL_PASSWORD_CLEAN"
          echo "::add-mask::$JWT_SECRET_CLEAN"

          {
            echo "CI_MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD_CLEAN"
            echo "CI_MYSQL_PASSWORD=$MYSQL_PASSWORD_CLEAN"
            echo "DB_PASSWORD=$MYSQL_PASSWORD_CLEAN"
            echo "JWT_SECRET=$JWT_SECRET_CLEAN"
          } >> "$GITHUB_ENV"

      - name: Start MySQL
        run: |
          docker run --detach \
            --name eventmanager-mysql-ci \
            --publish 3307:3306 \
            --env MYSQL_ROOT_PASSWORD="$CI_MYSQL_ROOT_PASSWORD" \
            --env MYSQL_DATABASE="$CI_MYSQL_DATABASE" \
            --env MYSQL_USER="$CI_MYSQL_USER" \
            --env MYSQL_PASSWORD="$CI_MYSQL_PASSWORD" \
            mysql:8.0

          for attempt in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' eventmanager-mysql-ci 2>/dev/null)" != "true" ]; then
              echo "MySQL container stopped"
              docker logs eventmanager-mysql-ci
              exit 1
            fi

            if docker exec \
              -e MYSQL_PWD="$CI_MYSQL_ROOT_PASSWORD" \
              eventmanager-mysql-ci \
              mysqladmin ping -h 127.0.0.1 -uroot --silent;
            then
              echo "MySQL is ready"
              exit 0
            fi

            sleep 2
          done

          docker logs eventmanager-mysql-ci
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Initialize test database
        run: |
          docker exec \
            -e MYSQL_PWD="$CI_MYSQL_ROOT_PASSWORD" \
            -i eventmanager-mysql-ci \
            mysql -uroot "$CI_MYSQL_DATABASE" < db/init.sql

          docker exec \
            -e MYSQL_PWD="$CI_MYSQL_ROOT_PASSWORD" \
            -i eventmanager-mysql-ci \
            mysql -uroot "$CI_MYSQL_DATABASE" < db/sample_data.sql

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --ci --runInBand --forceExit

      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --ci --watchAll=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend e2e tests
        working-directory: frontend
        run: npm run test:e2e

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    env:
      JWT_SECRET: ci-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Trivy reports directory
        run: mkdir -p trivy-reports

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: Validate compose file
        run: docker compose config -q

      - name: Build backend image
        run: docker build --tag eventmanager-backend:ci ./backend

      - name: Scan backend image with Trivy
        run: |
          trivy image \
            --skip-version-check \
            --format table \
            --output trivy-reports/backend-image.txt \
            --severity HIGH,CRITICAL \
            --pkg-types os,library \
            --ignore-unfixed \
            --exit-code 0 \
            eventmanager-backend:ci

      - name: Build frontend image
        run: docker build --tag eventmanager-frontend:ci ./frontend

      - name: Scan frontend image with Trivy
        run: |
          trivy image \
            --skip-version-check \
            --format table \
            --output trivy-reports/frontend-image.txt \
            --severity HIGH,CRITICAL \
            --pkg-types os,library \
            --ignore-unfixed \
            --exit-code 0 \
            eventmanager-frontend:ci

      - name: Scan repository filesystem with Trivy
        run: |
          trivy fs \
            --skip-version-check \
            --format table \
            --output trivy-reports/filesystem.txt \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --pkg-types os,library \
            --ignore-unfixed \
            --skip-dirs backend/node_modules \
            --skip-dirs frontend/node_modules \
            --exit-code 0 \
            .

      - name: Scan Docker and Compose configuration with Trivy
        run: |
          trivy config \
            --skip-version-check \
            --format table \
            --output trivy-reports/configuration.txt \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            .

      - name: Enforce backend image critical vulnerability gate
        run: |
          trivy image \
            --skip-version-check \
            --format table \
            --output trivy-reports/backend-image-critical.txt \
            --severity CRITICAL \
            --pkg-types os,library \
            --ignore-unfixed \
            --exit-code 1 \
            eventmanager-backend:ci

      - name: Enforce frontend image critical vulnerability gate
        run: |
          trivy image \
            --skip-version-check \
            --format table \
            --output trivy-reports/frontend-image-critical.txt \
            --severity CRITICAL \
            --pkg-types os,library \
            --ignore-unfixed \
            --exit-code 1 \
            eventmanager-frontend:ci

      - name: Enforce filesystem critical vulnerability gate
        run: |
          trivy fs \
            --skip-version-check \
            --format table \
            --output trivy-reports/filesystem-critical.txt \
            --scanners vuln \
            --severity CRITICAL \
            --pkg-types os,library \
            --ignore-unfixed \
            --skip-dirs backend/node_modules \
            --skip-dirs frontend/node_modules \
            --exit-code 1 \
            .

      - name: Enforce configuration critical vulnerability gate
        run: |
          trivy config \
            --skip-version-check \
            --format table \
            --output trivy-reports/configuration-critical.txt \
            --severity CRITICAL \
            --exit-code 1 \
            .

      - name: Publish Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy security scan"
            echo
            echo "Reports scan Docker images, application dependencies, OS packages and Docker/Compose configuration."
            echo "The CI fails on fixed CRITICAL vulnerabilities. HIGH findings remain visible in the reports."
            echo
            for report in trivy-reports/*.txt; do
              echo "### ${report#trivy-reports/}"
              echo '```text'
              if [ -s "$report" ]; then
                sed -n '1,220p' "$report"
              else
                echo "No findings."
              fi
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: trivy-reports/
          retention-days: 30
