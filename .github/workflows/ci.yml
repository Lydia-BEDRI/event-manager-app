name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: eventmanager
          MYSQL_USER: eventmanager_user
          MYSQL_PASSWORD: eventmanager_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -prootpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: eventmanager_user
      DB_PASSWORD: eventmanager_password
      DB_NAME: eventmanager
      JWT_SECRET: ci-secret-key
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (backend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm run test -- --ci

      - name: Backend build
        run: |
          cd backend
          npm run build

      - name: Frontend tests
        run: |
          cd frontend
          npm run test -- --ci

      - name: Frontend build
        run: |
          cd frontend
          npm run build

  compose-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: eventmanager
          MYSQL_USER: eventmanager_user
          MYSQL_PASSWORD: eventmanager_password
        run: docker compose config -q
