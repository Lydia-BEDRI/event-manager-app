name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
      CI_MYSQL_DATABASE: eventmanager
      CI_MYSQL_USER: eventmanager_user
      CI_MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: eventmanager_user
      DB_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
      DB_NAME: eventmanager
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize and validate required CI secrets
        run: |
          MYSQL_ROOT_PASSWORD_CLEAN="$(printf '%s' "$CI_MYSQL_ROOT_PASSWORD" | tr -d '\r\n')"
          MYSQL_PASSWORD_CLEAN="$(printf '%s' "$CI_MYSQL_PASSWORD" | tr -d '\r\n')"
          JWT_SECRET_CLEAN="$(printf '%s' "$JWT_SECRET" | tr -d '\r\n')"

          test -n "$MYSQL_ROOT_PASSWORD_CLEAN" || (echo "Missing secret CI_MYSQL_ROOT_PASSWORD" && exit 1)
          test -n "$MYSQL_PASSWORD_CLEAN" || (echo "Missing secret CI_MYSQL_PASSWORD" && exit 1)
          test -n "$JWT_SECRET_CLEAN" || (echo "Missing secret CI_JWT_SECRET" && exit 1)

          echo "::add-mask::$MYSQL_ROOT_PASSWORD_CLEAN"
          echo "::add-mask::$MYSQL_PASSWORD_CLEAN"
          echo "::add-mask::$JWT_SECRET_CLEAN"

          {
            echo "CI_MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD_CLEAN"
            echo "CI_MYSQL_PASSWORD=$MYSQL_PASSWORD_CLEAN"
            echo "DB_PASSWORD=$MYSQL_PASSWORD_CLEAN"
            echo "JWT_SECRET=$JWT_SECRET_CLEAN"
          } >> "$GITHUB_ENV"

      - name: Start MySQL
        run: |
          docker run --detach \
            --name eventmanager-mysql-ci \
            --publish 3307:3306 \
            --env MYSQL_ROOT_PASSWORD="$CI_MYSQL_ROOT_PASSWORD" \
            --env MYSQL_DATABASE="$CI_MYSQL_DATABASE" \
            --env MYSQL_USER="$CI_MYSQL_USER" \
            --env MYSQL_PASSWORD="$CI_MYSQL_PASSWORD" \
            mysql:8.0

          for attempt in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' eventmanager-mysql-ci 2>/dev/null)" != "true" ]; then
              echo "MySQL container stopped"
              docker logs eventmanager-mysql-ci
              exit 1
            fi

            if docker exec \
              -e MYSQL_PWD="$CI_MYSQL_ROOT_PASSWORD" \
              eventmanager-mysql-ci \
              mysqladmin ping -h 127.0.0.1 -uroot --silent;
            then
              echo "MySQL is ready"
              exit 0
            fi

            sleep 2
          done

          docker logs eventmanager-mysql-ci
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Initialize test database
        run: |
          docker exec \
            -e MYSQL_PWD="$CI_MYSQL_ROOT_PASSWORD" \
            -i eventmanager-mysql-ci \
            mysql -uroot "$CI_MYSQL_DATABASE" < db/init.sql

          docker exec \
            -e MYSQL_PWD="$CI_MYSQL_ROOT_PASSWORD" \
            -i eventmanager-mysql-ci \
            mysql -uroot "$CI_MYSQL_DATABASE" < db/sample_data.sql

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --ci --runInBand --forceExit

      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --ci --watchAll=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      NODE_ENV: test
      CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
      CI_MYSQL_DATABASE: eventmanager
      CI_MYSQL_USER: eventmanager_user
      CI_MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: eventmanager_user
      DB_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
      DB_NAME: eventmanager
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      QR_CODE_PRIVATE_KEY: e2e-qr-private-key
      FRONTEND_URL: http://127.0.0.1:3000
      CORS_ORIGIN: http://127.0.0.1:3000
      E2E_FRONTEND_URL: http://127.0.0.1:3000
      E2E_BACKEND_URL: http://127.0.0.1:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize and validate required CI secrets
        run: |
          MYSQL_ROOT_PASSWORD_CLEAN="$(printf '%s' "$CI_MYSQL_ROOT_PASSWORD" | tr -d '\r\n')"
          MYSQL_PASSWORD_CLEAN="$(printf '%s' "$CI_MYSQL_PASSWORD" | tr -d '\r\n')"
          JWT_SECRET_CLEAN="$(printf '%s' "$JWT_SECRET" | tr -d '\r\n')"

          test -n "$MYSQL_ROOT_PASSWORD_CLEAN" || (echo "Missing secret CI_MYSQL_ROOT_PASSWORD" && exit 1)
          test -n "$MYSQL_PASSWORD_CLEAN" || (echo "Missing secret CI_MYSQL_PASSWORD" && exit 1)
          test -n "$JWT_SECRET_CLEAN" || (echo "Missing secret CI_JWT_SECRET" && exit 1)

          echo "::add-mask::$MYSQL_ROOT_PASSWORD_CLEAN"
          echo "::add-mask::$MYSQL_PASSWORD_CLEAN"
          echo "::add-mask::$JWT_SECRET_CLEAN"

          {
            echo "CI_MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD_CLEAN"
            echo "CI_MYSQL_PASSWORD=$MYSQL_PASSWORD_CLEAN"
            echo "DB_PASSWORD=$MYSQL_PASSWORD_CLEAN"
            echo "JWT_SECRET=$JWT_SECRET_CLEAN"
          } >> "$GITHUB_ENV"

      - name: Start and initialize MySQL
        run: |
          docker run --detach \
            --name eventmanager-mysql-e2e \
            --publish 3307:3306 \
            --env MYSQL_ROOT_PASSWORD="$CI_MYSQL_ROOT_PASSWORD" \
            --env MYSQL_DATABASE="$CI_MYSQL_DATABASE" \
            --env MYSQL_USER="$CI_MYSQL_USER" \
            --env MYSQL_PASSWORD="$CI_MYSQL_PASSWORD" \
            mysql:8.0

          for attempt in {1..30}; do
            if docker exec \
              -e MYSQL_PWD="$CI_MYSQL_ROOT_PASSWORD" \
              eventmanager-mysql-e2e \
              mysqladmin ping -h 127.0.0.1 -uroot --silent;
            then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs eventmanager-mysql-e2e
              exit 1
            fi
            sleep 2
          done

          docker exec -e MYSQL_PWD="$CI_MYSQL_ROOT_PASSWORD" -i eventmanager-mysql-e2e \
            mysql -uroot "$CI_MYSQL_DATABASE" < db/init.sql
          docker exec -e MYSQL_PWD="$CI_MYSQL_ROOT_PASSWORD" -i eventmanager-mysql-e2e \
            mysql -uroot "$CI_MYSQL_DATABASE" < db/sample_data.sql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install application dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Stop E2E database
        if: ${{ always() }}
        run: docker rm --force eventmanager-mysql-e2e

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - e2e

    env:
      JWT_SECRET: ci-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build backend image
        run: docker build --tag eventmanager-backend:ci ./backend

      - name: Build frontend image
        run: docker build --tag eventmanager-frontend:ci ./frontend
