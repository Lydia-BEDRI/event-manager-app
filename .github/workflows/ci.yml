name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
      CI_MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE }}
      CI_MYSQL_USER: ${{ secrets.CI_MYSQL_USER }}
      CI_MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: ${{ secrets.CI_MYSQL_USER }}
      DB_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
      DB_NAME: ${{ secrets.CI_MYSQL_DATABASE }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required CI secrets
        run: |
          test -n "$CI_MYSQL_ROOT_PASSWORD" || (echo "Missing secret CI_MYSQL_ROOT_PASSWORD" && exit 1)
          test -n "$CI_MYSQL_DATABASE" || (echo "Missing secret CI_MYSQL_DATABASE" && exit 1)
          test -n "$CI_MYSQL_USER" || (echo "Missing secret CI_MYSQL_USER" && exit 1)
          test -n "$CI_MYSQL_PASSWORD" || (echo "Missing secret CI_MYSQL_PASSWORD" && exit 1)
          test -n "$JWT_SECRET" || (echo "Missing secret CI_JWT_SECRET" && exit 1)

      - name: Start MySQL
        run: |
          docker run --detach \
            --name eventmanager-mysql-ci \
            --publish 3307:3306 \
            --env MYSQL_ROOT_PASSWORD="$CI_MYSQL_ROOT_PASSWORD" \
            --env MYSQL_DATABASE="$CI_MYSQL_DATABASE" \
            --env MYSQL_USER="$CI_MYSQL_USER" \
            --env MYSQL_PASSWORD="$CI_MYSQL_PASSWORD" \
            mysql:8.0

          for attempt in {1..30}; do
            if docker exec eventmanager-mysql-ci mysqladmin ping -h 127.0.0.1 -uroot -p"$CI_MYSQL_ROOT_PASSWORD" --silent; then
              exit 0
            fi
            sleep 2
          done

          docker logs eventmanager-mysql-ci
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Initialize test database
        run: |
          docker exec -i eventmanager-mysql-ci mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" "$CI_MYSQL_DATABASE" < db/init.sql
          docker exec -i eventmanager-mysql-ci mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" "$CI_MYSQL_DATABASE" < db/sample_data.sql

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --ci --runInBand

      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --ci --watchAll=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    env:
      JWT_SECRET: ci-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build backend image
        run: docker build --tag eventmanager-backend:ci ./backend

      - name: Build frontend image
        run: docker build --tag eventmanager-frontend:ci ./frontend
